<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anki Add Vocabulary — UI prototype</title>
    <style>
      :root { --ink:#111827; --muted:#667085; --line:#d9dee7; --surface:#fff; --quiet:#f4f6f9; --blue:#3867df; --blue-dark:#254fbd; --green:#16794b; --danger:#c13b3b; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#eef1f5; color:var(--ink); font:16px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .browser { width:min(1120px, calc(100vw - 32px)); min-height:680px; margin:36px auto 100px; overflow:hidden; border:1px solid #ccd3dd; border-radius:18px; background:var(--surface); box-shadow:0 24px 60px rgba(31,41,55,.14); }
      .chrome { display:flex; align-items:center; gap:8px; height:48px; padding:0 18px; border-bottom:1px solid var(--line); background:#f8fafc; } .dot { width:10px; height:10px; border-radius:50%; background:#cbd5e1; } .address { flex:1; margin-left:14px; padding:6px 12px; border-radius:7px; background:#e9edf3; color:#98a2b3; font-size:13px; }
      article { width:min(720px, calc(100% - 48px)); margin:68px auto; color:#374151; } h1 { font-size:38px; line-height:1.08; letter-spacing:-.04em; } article p { max-width:650px; font-size:18px; line-height:1.75; } mark { border-radius:4px; background:#fddf8c; padding:1px 3px; }
      .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(15,23,42,.12); } .overlay[data-open="false"] { display:none; }
      .card { width:min(460px, 100%); border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 22px 60px rgba(15,23,42,.24); overflow:hidden; }
      .card-head { display:flex; align-items:center; justify-content:space-between; padding:15px 18px 12px; border-bottom:1px solid #edf0f4; } .eyebrow { color:#667085; font-size:12px; font-weight:800; letter-spacing:.1em; } .icon { border:0; background:transparent; color:#667085; font-size:24px; cursor:pointer; }
      .card-body { padding:16px 18px 18px; } .term { margin:0; font-size:30px; letter-spacing:-.03em; } .phonetic { margin-top:3px; color:var(--muted); font-size:14px; } .translation { margin:16px 0 6px; font-size:22px; font-weight:750; } .type { color:#6b7280; font-size:13px; font-weight:650; } .context { margin-top:16px; padding:12px; border-left:3px solid #8aa7f1; background:#f6f8fe; color:#475467; font-size:14px; line-height:1.55; }
      .actions { display:flex; gap:10px; margin-top:16px; } button { font:inherit; } .button { flex:1; min-height:43px; padding:10px 14px; border:1px solid var(--line); border-radius:9px; background:#fff; color:#475467; font-weight:750; cursor:pointer; } .button.primary { border-color:var(--blue); background:var(--blue); color:#fff; } .button.primary:hover { background:var(--blue-dark); } .button.dark { border-color:var(--ink); background:var(--ink); color:#fff; } .button:disabled { cursor:wait; opacity:.65; }
      .form { display:grid; gap:11px; padding:16px; border-radius:12px; background:var(--quiet); } label { display:grid; gap:4px; color:#596579; font-size:13px; font-weight:700; } input, textarea, select { width:100%; padding:9px 10px; border:1px solid #cfd6e0; border-radius:8px; background:#fff; color:var(--ink); font:16px/1.25 inherit; } textarea { min-height:66px; resize:vertical; } .split { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .steps { display:flex; align-items:center; gap:8px; margin:0 0 16px; color:#98a2b3; font-size:12px; font-weight:750; } .steps span.active { color:var(--blue); } .steps i { height:1px; flex:1; background:#d8dee8; }
      .deck { display:flex; align-items:center; gap:11px; padding:13px; border:1px solid var(--line); border-radius:10px; cursor:pointer; } .deck.selected { border-color:var(--blue); background:#f0f4ff; } .deck-icon { display:grid; width:38px; height:38px; place-items:center; border-radius:9px; background:#e9efff; color:var(--blue); font-weight:900; } .deck small { display:block; color:var(--muted); } .deck-title { flex:1; font-weight:800; }
      .success { padding:28px 18px; text-align:center; } .check { display:grid; width:48px; height:48px; place-items:center; margin:0 auto 12px; border-radius:50%; background:#dbf6e7; color:var(--green); font-size:24px; font-weight:900; }
      .selection { position:absolute; top:365px; left:calc(50% - 84px); display:flex; gap:7px; align-items:center; padding:8px 11px; border-radius:10px; background:var(--blue); color:#fff; box-shadow:0 10px 25px rgba(36,80,189,.3); font-weight:800; cursor:pointer; } .selection kbd { padding:2px 5px; border-radius:4px; background:rgba(255,255,255,.18); font:12px/1.2 inherit; }
      .prototype-bar { position:fixed; z-index:5; bottom:18px; left:50%; display:flex; align-items:center; gap:12px; transform:translateX(-50%); padding:9px 11px; border:1px solid #344054; border-radius:999px; background:#101828; color:#fff; box-shadow:0 10px 30px rgba(15,23,42,.28); } .prototype-bar button { width:31px; height:31px; border:0; border-radius:50%; background:#344054; color:#fff; font-size:18px; cursor:pointer; } .prototype-bar span { min-width:190px; text-align:center; font-size:13px; font-weight:700; } .note { margin:0 0 12px; color:#667085; font-size:13px; }
      @media (max-width:600px) { article { margin:38px auto; } h1 { font-size:30px; } .selection { top:340px; } .split { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main class="browser">
      <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="address">news.example.com/markets-rebound</div></div>
      <article><p class="eyebrow">BUSINESS</p><h1>Markets recover after a difficult quarter</h1><p>Markets fell sharply. The company proved <mark>resilient</mark> in the downturn. Analysts now expect the business to recover more quickly than previously forecast.</p></article>
      <button class="selection" id="start" type="button">+ Anki <kbd>Alt+A</kbd></button>
    </main>
    <div class="overlay" id="overlay" data-open="false"></div>
    <nav class="prototype-bar"><button id="previous" aria-label="Previous variant">‹</button><span id="variant-name"></span><button id="next" aria-label="Next variant">›</button></nav>
    <script>
      const overlay = document.querySelector('#overlay');
      const variants = [
        { key:'A', name:'A — Translate → Review → Add', render: reviewFirst },
        { key:'B', name:'B — Compact side-by-side', render: compact },
        { key:'C', name:'C — Deck-first wizard', render: deckFirst },
      ];
      let state = { variant: new URLSearchParams(location.search).get('variant') || 'A', screen:'idle', deck:'English Vocabulary' };
      const copy = { term:'resilient', translation:'kiên cường; có khả năng phục hồi', pronunciation:'/rɪˈzɪliənt/', type:'adjective', example:'The company proved resilient in the downturn.', synonyms:'strong; robust; adaptable' };
      function variant() { return variants.find(item => item.key === state.variant) || variants[0]; }
      function open(screen='translating') { state.screen = screen; overlay.dataset.open = 'true'; render(); }
      function close() { overlay.dataset.open = 'false'; state.screen='idle'; }
      function add() { state.screen='success'; render(); }
      function reviewFirst() {
        if (state.screen === 'translating') return `<section class="card"><div class="card-head"><span class="eyebrow">TRANSLATING SELECTION</span><button class="icon" data-close>×</button></div><div class="card-body"><h2 class="term">${copy.term}</h2><p class="note">Finding Vietnamese meaning, pronunciation, type and an example from the selected sentence…</p><div class="context">${copy.example}</div><div class="actions"><button class="button primary" disabled>Translating…</button></div></div></section>`;
        if (state.screen === 'success') return success();
        return `<section class="card"><div class="card-head"><span class="eyebrow">REVIEW BEFORE ADDING</span><button class="icon" data-close>×</button></div><div class="card-body"><p class="note">Recommended: users see translation first, edit only when needed, then select the Anki deck.</p><div class="form"><label>Term<input value="${copy.term}" /></label><label>Vietnamese definition<input value="${copy.translation}" /></label><div class="split"><label>Pronunciation<input value="${copy.pronunciation}" /></label><label>Type<input value="${copy.type}" /></label></div><label>Example<textarea>${copy.example}</textarea></label></div><div class="deck selected"><span class="deck-icon">A</span><span class="deck-title">${state.deck}<small>Anki deck · select at add time</small></span><button class="button" data-deck>Change</button></div><div class="actions"><button class="button" data-close>Cancel</button><button class="button primary" data-add>Add to Anki</button></div></div></section>`;
      }
      function compact() {
        if (state.screen === 'success') return success();
        return `<section class="card"><div class="card-head"><span class="eyebrow">${state.screen === 'translating' ? 'TRANSLATING…' : 'ANKI PREVIEW'}</span><button class="icon" data-close>×</button></div><div class="card-body"><p class="note">One compact decision panel. Faster, but fields are denser.</p><div class="split"><div><h2 class="term">${copy.term}</h2><p class="phonetic">${copy.pronunciation} · ${copy.type}</p><div class="context">${copy.example}</div></div><div><p class="translation">${state.screen === 'translating' ? '…' : copy.translation}</p><p class="type">${state.screen === 'translating' ? 'Looking up definition' : 'Synonyms: '+copy.synonyms}</p></div></div><label style="margin-top:15px">Anki deck<select><option>${state.deck}</option><option>Business English</option></select></label><div class="actions"><button class="button" data-close>Skip</button><button class="button primary" ${state.screen === 'translating' ? 'disabled' : 'data-add'}>${state.screen === 'translating' ? 'Translating…' : 'Add to Anki'}</button></div></div></section>`;
      }
      function deckFirst() {
        if (state.screen === 'success') return success();
        if (state.screen === 'translating') return `<section class="card"><div class="card-head"><span class="eyebrow">STEP 1 OF 3</span><button class="icon" data-close>×</button></div><div class="card-body"><div class="steps"><span class="active">TRANSLATE</span><i></i><span>DECK</span><i></i><span>ADD</span></div><h2 class="term">${copy.term}</h2><p class="note">Translation runs first. The user never sees an unverified empty card.</p><div class="actions"><button class="button primary" disabled>Translating…</button></div></div></section>`;
        if (state.screen === 'deck') return `<section class="card"><div class="card-head"><span class="eyebrow">STEP 2 OF 3</span><button class="icon" data-close>×</button></div><div class="card-body"><div class="steps"><span>TRANSLATE</span><i></i><span class="active">DECK</span><i></i><span>ADD</span></div><h2 class="term">Choose an Anki deck</h2><p class="note">Decks come from AnkiConnect. This is not an OpenQuiz vocabulary set.</p><div class="deck selected" data-select-deck><span class="deck-icon">A</span><span class="deck-title">English Vocabulary<small>127 cards</small></span></div><div class="deck" data-select-deck><span class="deck-icon">A</span><span class="deck-title">Business English<small>42 cards</small></span></div><div class="actions"><button class="button" data-review>Back</button><button class="button dark" data-review>Review card</button></div></div></section>`;
        return `<section class="card"><div class="card-head"><span class="eyebrow">STEP 3 OF 3</span><button class="icon" data-close>×</button></div><div class="card-body"><div class="steps"><span>TRANSLATE</span><i></i><span>DECK</span><i></i><span class="active">ADD</span></div><h2 class="term">${copy.term}</h2><p class="translation">${copy.translation}</p><p class="phonetic">${copy.pronunciation} · ${copy.type}</p><div class="context">${copy.example}</div><div class="deck selected"><span class="deck-icon">A</span><span class="deck-title">${state.deck}<small>Ready to add</small></span></div><div class="actions"><button class="button" data-deck>Change deck</button><button class="button primary" data-add>Add to Anki</button></div></div></section>`;
      }
      function success() { return `<section class="card"><div class="success"><div class="check">✓</div><h2 class="term">Added to Anki</h2><p class="note"><b>${copy.term}</b> was added to <b>${state.deck}</b>. The selected source sentence is attached to the note.</p><button class="button primary" data-close>Keep reading</button></div></section>`; }
      function render() { document.querySelector('#variant-name').textContent = variant().name; overlay.innerHTML = variant().render(); if (state.screen === 'translating') setTimeout(() => { if (state.screen === 'translating') { state.screen = state.variant === 'C' ? 'deck' : 'review'; render(); } }, 750); overlay.querySelectorAll('[data-close]').forEach(node => node.onclick = close); overlay.querySelectorAll('[data-add]').forEach(node => node.onclick = add); overlay.querySelectorAll('[data-deck]').forEach(node => { node.onclick = () => { state.screen='deck'; render(); }; }); overlay.querySelectorAll('[data-review]').forEach(node => { node.onclick = () => { state.screen='review'; render(); }; }); overlay.querySelectorAll('[data-select-deck]').forEach(node => { node.onclick = () => { state.deck=node.querySelector('.deck-title').childNodes[0].textContent.trim(); state.screen='review'; render(); }; }); }
      function setVariant(offset) { const index = variants.findIndex(item => item.key === state.variant); state.variant = variants[(index + offset + variants.length) % variants.length].key; history.replaceState(null, '', `?variant=${state.variant}`); state.screen='idle'; close(); document.querySelector('#variant-name').textContent=variant().name; }
      document.querySelector('#start').onclick = () => open(); document.querySelector('#previous').onclick=()=>setVariant(-1); document.querySelector('#next').onclick=()=>setVariant(1); document.addEventListener('keydown', event => { if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return; if (event.key==='ArrowLeft') setVariant(-1); if (event.key==='ArrowRight') setVariant(1); if (event.key==='Escape') close(); }); document.querySelector('#variant-name').textContent=variant().name;
    </script>
  </body>
</html>
